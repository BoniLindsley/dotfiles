[tool.black]
line-length = 78

[tool.pytest.ini_options]
markers = [
  "integration: tests that exercise external applications such as Neovim",
]

[tool.coverage.report]
exclude_lines = [
  "if typing\\.TYPE_CHECKING:",  # Ignore blocks used only by type checkers.
  "@typing.overload",  # Type hints do not need to be ran.
  "def main\\(",  # Main function typically requires full set up to run.
  "if __name__ == \"__main__\"",  # Ignore main script.
  "pragma: no cover",  # Fine grained bypass.
]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
command_line = "-m pytest"
omit = [
  # Usually requires full-fletched set up to use.
  "*/__main__.py",
  # Build recipes require external source trees and toolchains.
  "src/bonipy35/bapt/manifests.py",
  # Temporarily disable coverage until refactoring is done.
  "src/bonipy35/alarm/*",
]
source = [
  "src",
]

[tool.mypy]
mypy_path = "src:stubs:tests"
show_error_codes = true
strict = true

[tool.pylint.MAIN]
# Resolve standard modules missing here, such as `tkinter` without Tk,
# from the typeshed stubs bundled with mypy.
# Astroid calls the hook only when an import fails,
# so installed modules are always checked instead.
# The hook runs inside `exec` in a function, so names defined here
# are not visible to `_from_typeshed`: it imports its own
# and is bound with `functools.partial`.
init-hook = """
import functools
import importlib.util
import pathlib

def _from_typeshed(modname, *, stdlib):
    import astroid
    from astroid.builder import AstroidBuilder
    from astroid.exceptions import AstroidBuildingError

    base = stdlib.joinpath(*modname.split("."))
    for path in (base.with_suffix(".pyi"), base / "__init__.pyi"):
        if path.is_file():
            builder = AstroidBuilder(astroid.MANAGER)
            return builder.file_build(str(path), modname)
    raise AstroidBuildingError(modname=modname)

_mypy = importlib.util.find_spec("mypy")
if _mypy is not None and _mypy.submodule_search_locations:
    import astroid

    astroid.MANAGER.register_failed_import_hook(
        functools.partial(
            _from_typeshed,
            stdlib=pathlib.Path(
                _mypy.submodule_search_locations[0], "typeshed", "stdlib"
            ),
        )
    )
"""

[tool.pylint.BASIC]
# Violation of naming convention that should be accepted.
good-names = [
  # Used by convention.
  "_T",  # TypeVar name.
  "_T_co",  # TypeVar name.
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  # Global statements are already explicit.
  # Not using per-case disables
  # which will end up being used in every case.
  # By doing a disable here, finding them when necessary will be easier.
  "global-statement",

  # It does not always make sense to document.
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",

  # Allow intentionally disabled checks.
  "locally-disabled",
  "suppressed-message",

  # Not checking based on numbers.
  "too-few-public-methods",
  "too-many-ancestors",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-public-methods",

  # Temporary control to before moving to 88 columns.
  "line-too-long",

  # For Python 3.5 support.
  "consider-using-f-string",
]
enable = [
  # Disabled by default.
  "bad-inline-option",
  "deprecated-pragma",
  "file-ignored",
  "raw-checker-failed",
  "use-symbolic-message-instead",

  # Ensure future warnings are not hidden.
  "useless-suppression",
]
