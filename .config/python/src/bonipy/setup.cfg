[metadata]
name = bonipy
version = 0.1.0
author = Boni Lindsley
author_email = boni@lindsley.xyz
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
description = My tools
long_description = file: README.md
long_description_content_type = text/markdown

[options]
include_package_data = True
install_requires =
    bonipy35 >= 0.1.0 ; python_version >= "3.5"

    click >= 8.5.0; python_version >= "3.10"
    click >= 8.1.8; python_version >= "3.7" and python_version < "3.10"
    click >= 8.0.4; python_version == "3.6"
    click >= 7.1.2; python_version == "3.5"

    click_repl >= 0.4.1; python_version >= "3.9"
    click_repl >= 0.3.0; python_version >= "3.6" and python_version < "3.9"
    click_repl >= 0.2.0; python_version == "3.5"

    pydantic >= 2.14.1; python_version >= "3.10"
    pydantic >= 2.13.5; python_version == "3.9"
    pydantic >= 2.10.6; python_version == "3.8"
    pydantic >= 2.5.3; python_version == "3.7"
    pydantic >= 1.9.2; python_version == "3.6"
    # No Python 3.5 support for Pydantic.

python_requires = >= 3.5
packages = find_namespace:
package_dir =
    = src

[options.entry_points]
console_scripts =
  bonipy = bonipy.__main__:main
  textual_how = bonipy.textual_how:main

[options.extras_require]
dev =
    Sphinx >= 9.2.0; python_version >= "3.13"
    Sphinx >= 9.1.1; python_version == "3.12"
    Sphinx >= 9.0.4; python_version == "3.11"
    Sphinx >= 8.1.3; python_version == "3.10"
    Sphinx >= 7.4.7; python_version == "3.9"
    Sphinx >= 7.1.2; python_version == "3.8"
    Sphinx >= 5.3.0; python_version >= "3.6" and python_version < "3.8"
    Sphinx >= 3.5.4; python_version == "3.5"

    black >= 26.10.1; python_version >= "3.10"
    black >= 25.11.0; python_version == "3.9"
    black >= 24.8.0; python_version == "3.8"
    black >= 23.3.0; python_version == "3.7"
    black >= 22.8.0; python_version == "3.6"
    # Not compatible with Python 3.5.

    coverage[toml] >= 7.16.2; python_version >= "3.10"
    coverage[toml] >= 7.10.7; python_version == "3.9"
    coverage[toml] >= 7.6.1; python_version == "3.8"
    coverage[toml] >= 7.2.7; python_version == "3.7"
    coverage[toml] >= 6.2; python_version == "3.6"
    coverage[toml] >= 5.5; python_version == "3.5"

    mypy >= 2.4.0; python_version >= "3.10"
    mypy >= 1.19.1; python_version == "3.9"
    mypy >= 1.14.1; python_version == "3.8"
    mypy >= 1.4.1; python_version == "3.7"
    mypy >= 0.971; python_version == "3.6"
    mypy >= 0.700; python_version == "3.5"

    pandas-stubs >= 3.0.5.260914; python_version >= "3.11"
    pandas-stubs >= 2.3.3.260113; python_version == "3.10"
    pandas-stubs >= 2.2.2.240807; python_version == "3.9"
    pandas-stubs >= 2.0.3.230814; python_version == "3.8"
    pandas-stubs >= 1.2.0.62; python_version >= "3.6" and python_version < "3.8"

    pylint >= 4.1.2; python_version >= "3.10"
    pylint >= 3.3.9; python_version == "3.9"
    pylint >= 3.2.7; python_version == "3.8"
    pylint >= 2.17.7; python_version == "3.7"
    pylint >= 2.13.9; python_version == "3.6"
    pylint >= 2.4.0; python_version == "3.5"

    pytest >= 9.1.1; python_version >= "3.10"
    pytest >= 8.4.2; python_version == "3.9"
    pytest >= 8.3.5; python_version == "3.8"
    pytest >= 7.4.4; python_version == "3.7"
    pytest >= 7.0.1; python_version == "3.6"
    pytest >= 6.1.2; python_version == "3.5"

    tox >= 4.65.1; python_version >= "3.11"
    tox >= 4.65.0; python_version == "3.10"
    tox >= 4.30.3; python_version == "3.9"
    tox >= 4.25.0; python_version == "3.8"
    tox >= 4.8.0; python_version == "3.7"
    tox >= 3.28.0; python_version >= "3.5" and python_version <= "3.6"
notification =
    fastapi >= 0.110.2
ocr =
    pytesseract >= 0.3.13
textual-how =
    pydantic >= 2.6.1
    textual >= 0.68.0
todo =
    markdown-it-py[plugins] >= 3.0.0
    mdformat >= 0.7.17
    pydantic >= 2.6.1
torch-how =
    matplotlib >= 3.10.0
    numpy >= 2.2.1
    pandas >= 2.2.3
    platformdirs >= 4.3.6
    scikit-learn >= 1.6.1
    torch >= 2.5.1
    torchvision >= 0.20.1

[options.package_data]
* = py.typed

[options.packages.find]
where = src

[tox:tox]
env_list = py
min_version = 4.4.11

[testenv]
commands =
    {envpython} -m black --check --diff src stubs tests setup.py docs
    {envpython} -m mypy \
        --package bonipy \
        --package test_bonipy \
        --package docs
    {envpython} -m mypy setup.py stubs
    {envpython} -m pylint \
        bonipy \
        tests/test_bonipy \
        docs \
        setup.py
    {envpython} -m coverage erase
    {envpython} -m coverage run
    {envpython} -m coverage report
extras = dev
usedevelop = True
